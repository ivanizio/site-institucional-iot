<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Administração | Contatos</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <main>
      <h1>Contatos recebidos</h1>

      <button id="botaoLogout">Sair</button>

      <section id="areaEdicao">
        <h2>Editar contato</h2>

        <form id="formEditar">
          <input type="hidden" id="editarId" />

          <div>
            <label for="editarNome">Nome:</label>
            <input type="text" id="editarNome" required />
          </div>

          <div>
            <label for="editarEmail">E-mail:</label>
            <input type="email" id="editarEmail" required />
          </div>

          <div>
            <label for="editarMensagem">Mensagem:</label>
            <textarea id="editarMensagem" rows="4" required></textarea>
          </div>

          <button type="submit">Salvar alterações</button>
        </form>
      </section>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Mensagem</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="listaContatos"></tbody>
      </table>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
